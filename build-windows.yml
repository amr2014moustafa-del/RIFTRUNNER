name: Build Windows Game.exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build single-file Windows executable
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify Game.exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Game.exe")) { Get-ChildItem dist; throw "dist/Game.exe was not created" }
          Get-Item dist/Game.exe | Select-Object Name, Length

      - name: Upload Game.exe
        uses: actions/upload-artifact@v4
        with:
          name: Game-exe
          path: dist/Game.exe
          if-no-files-found: error
