name: Build RIFTRUNNER Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'main.js'
      - 'splash.html'
      - 'icon.ico'
      - 'icon.png'
      - '.github/workflows/build-game.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build portable Windows game
        run: npm run dist
      - name: Upload Game.exe
        uses: actions/upload-artifact@v4
        with:
          name: RIFTRUNNER-Game-exe
          path: dist/Game.exe
          if-no-files-found: error
          retention-days: 14
