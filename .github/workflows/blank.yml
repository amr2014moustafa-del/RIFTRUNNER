name: Build Windows Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate inline game JavaScript
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const a=h.indexOf('<script>')+8;const b=h.lastIndexOf('</script>');if(a<8||b<a)throw new Error('Inline script not found');new Function(h.slice(a,b));console.log('Game JavaScript syntax is valid')"

      - name: Install dependencies
        run: npm install

      - name: Build portable Game.exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify Game.exe
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Game.exe")) {
            Get-ChildItem -Recurse dist
            throw "dist/Game.exe was not created"
          }
          Get-Item "dist/Game.exe" | Select-Object Name, Length

      - name: Upload Game.exe
        uses: actions/upload-artifact@v4
        with:
          name: Game-exe
          path: dist/Game.exe
          if-no-files-found: error
